services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: campusloop
      MYSQL_USER: campusloop
      MYSQL_PASSWORD: ${DB_PASSWORD:-campusloop_local_only}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local_only}
    ports:
      - "3306:3306"
    volumes:
      - campusloop_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root_local_only}"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  campusloop_mysql:
